services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eurosat-backend
    restart: always
    volumes:
      - ./backend/model:/app/model
    environment:
      - CORS_ORIGINS=*
      - MODEL_PATH=model/modelo_final_eurosat.keras
    networks:
      - eurosat-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eurosat-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
    networks:
      - eurosat-network
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: eurosat-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - eurosat-network

networks:
  eurosat-network:
    driver: bridge
