services:
  backend:
    build: ./backend
    container_name: eurosat-backend
    volumes:
      - ./backend/model:/app/model
    environment:
      - CORS_ORIGINS=*
    ports:
      - "8000:8000"
    networks:
      - eurosat-network
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  streamlit:
    build: ./streamlit_app
    container_name: eurosat-streamlit
    environment:
      - API_URL=http://backend:8000/api/v1
    ports:
      - "80:8501"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eurosat-network
    restart: always

networks:
  eurosat-network:
    driver: bridge
